name: API checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: slsea_test
          POSTGRES_USER: slsea_ci
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slsea_ci --dbname=slsea_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://slsea_ci:ci_test_only@127.0.0.1:5432/slsea_test
      TEST_DATABASE_URL: postgresql://slsea_ci:ci_test_only@127.0.0.1:5432/slsea_test
      DATABASE_SSL: "false"
      LOG_LEVEL: silent
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, test and build
        run: npm run check
      - name: Test with PostgreSQL
        run: npm run test:integration
