name: API checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_DB: slsea_test
          POSTGRES_USER: slsea_ci
          POSTGRES_PASSWORD: ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username=slsea_ci --dbname=slsea_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://slsea_ci:ci_test_only@127.0.0.1:5432/slsea_test
      TEST_DATABASE_URL: postgresql://slsea_ci:ci_test_only@127.0.0.1:5432/slsea_test
      DATABASE_SSL: "false"
      LOG_LEVEL: silent
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check public repository files
        run: npm run check:public
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, test and build
        run: npm run check
      - name: Test with PostgreSQL
        run: npm run test:integration
      - name: Stage App Service runtime files
        id: release
        run: node dist/cli/stage-release.js >> "$GITHUB_OUTPUT"
      - name: Install locked production dependencies in the Linux release
        run: npm ci --omit=dev --prefix "${{ steps.release.outputs.directory }}"
      - name: Verify and archive the App Service package
        working-directory: ${{ steps.release.outputs.directory }}
        run: |
          node --input-type=module -e "await import('./dist/app.js'); await import('@azure/identity'); console.log('App Service runtime imports verified')"
          zip -rq "$GITHUB_WORKSPACE/artifacts/slsea-appservice.zip" .
      - name: Retain the deployment package for review
        uses: actions/upload-artifact@v7
        with:
          name: slsea-appservice-${{ github.sha }}
          path: artifacts/slsea-appservice.zip
          if-no-files-found: error
          retention-days: 7
      - name: Build production image and verify packaged imports
        run: |
          docker build -t slsea-solar-api:ci .
          docker run --rm --entrypoint node slsea-solar-api:ci --input-type=module -e "await import('./dist/app.js'); console.log('Packaged application and OpenAPI loaded')"
