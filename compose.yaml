services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      # Public fixtures for local development only; never use for a hosted database.
      POSTGRES_DB: slsea
      POSTGRES_USER: slsea_dev
      POSTGRES_PASSWORD: local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=slsea_dev --dbname=slsea"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
