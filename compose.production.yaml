# Single API process behind a host/provider HTTPS reverse proxy.
# Database and schema-owner credentials are provisioned separately.
services:
  api:
    build: .
    image: slsea-solar-api:local
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 512m
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?Set the restricted runtime database URL}
      DATABASE_SSL: ${DATABASE_SSL:-true}
      JWT_SECRET: ${JWT_SECRET:?Set a private random signing key}
      JWT_ISSUER: ${JWT_ISSUER:-slsea-solar-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-slsea-solar-clients}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:3000:3000"
